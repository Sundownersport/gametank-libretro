name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            prefix: ''
          - arch: arm64
            prefix: aarch64-linux-gnu-
            pkg: g++-aarch64-linux-gnu
          - arch: armhf
            prefix: arm-linux-gnueabihf-
            pkg: g++-arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v5

      - name: Install cross compilers
        if: matrix.pkg
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}

      - name: Build
        run: |
          make -j"$(nproc)" CXX=${{ matrix.prefix }}g++
          ${{ matrix.prefix }}strip gametank_libretro.so

      - name: Check exports
        run: |
          file gametank_libretro.so
          readelf --dyn-syms -W gametank_libretro.so | grep -c ' retro_'

      - name: Package
        run: |
          mkdir -p dist
          cp gametank_libretro.so gametank_libretro.info dist/
          cd dist && zip ../gametank_libretro-linux-${{ matrix.arch }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: gametank_libretro-linux-${{ matrix.arch }}
          path: gametank_libretro-linux-${{ matrix.arch }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" *.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
