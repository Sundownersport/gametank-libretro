name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-linux-gnu.2.28
            cpu: x86_64
          - arch: arm64
            target: aarch64-linux-gnu.2.23
            cpu: cortex_a53
          - arch: armhf
            target: arm-linux-gnueabihf.2.23
            cpu: cortex_a7
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build
        run: make -j"$(nproc)" CXX="zig c++ -target ${{ matrix.target }} -mcpu=${{ matrix.cpu }}"

      - name: Check exports
        run: |
          file gametank_libretro.so
          readelf --dyn-syms -W gametank_libretro.so | grep -c ' retro_'

      - name: Package
        run: |
          mkdir -p dist
          cp gametank_libretro.so gametank_libretro.info dist/
          cd dist && zip ../gametank_libretro-linux-${{ matrix.arch }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: gametank_libretro-linux-${{ matrix.arch }}
          path: gametank_libretro-linux-${{ matrix.arch }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" *.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
